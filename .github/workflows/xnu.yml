name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      topaz_4k:
        description: 1 = build SWEET with 4 KiB pages (Cortex-A53 has no 16K granule)
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # makedefs/MakeInc.def: 4K-сборка SWEET включается только TOPAZ_4K=1 в окружении
  # (make берёт переменные из env); она же меняет ARM64_LINK_ADDR на компактный layout.
  TOPAZ_4K: ${{ inputs.topaz_4k || '1' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Pin one Xcode for the whole pipeline
        run: |
          # DEVELOPER_DIR written here is inherited by every later step, so xcrun,
          # xcodebuild and the clang baked into the ccache wrappers cannot drift
          # apart (a clang 16 object inside a libtool 15 archive fails with
          # "Invalid bitcode version Producer 1600 Reader 1500").
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "pinning $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XC/Contents/Developer"
          sudo xcode-select -s "$XC"
          SDKdir="$XC/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          echo "SDKs present:"; ls "$SDKdir" || true
          if [ ! -e "$SDKdir/MacOSX14.0.sdk" ]; then
            REAL=$(ls -d "$SDKdir"/MacOSX14*.sdk 2>/dev/null | head -1)
            echo "linking MacOSX14.0.sdk -> $REAL"
            sudo ln -sfn "$REAL" "$SDKdir/MacOSX14.0.sdk"
          fi
          ls -la "$SDKdir" | head -6
          xcodebuild -version
          xcrun -find clang
          xcrun -find iig
          clang --version | head -2

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # blacktop's own xnu patches target macOS 14.3+ trees and conflict
          # with the sweet/topaz set; they are not needed for an iOS kernel
          rm -f dxb/patches/TrustCache.patch dxb/patches/iobuffermemd_monterey.patch dxb/patches/skywalk_sonoma.patch
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"
          # the wrappers freeze a compiler path: prove it is the pinned toolchain
          # and not the runner default, otherwise host archives mix bitcode versions
          # (xcrun reports the symlinked Xcode_15.4.app, DEVELOPER_DIR the real dir)
          CL=$(cd "$(sed -n 's|^exec ccache \(.*\)/clang "\$@"$|\1|p' "$CCACHE_WRAP/clang")" && pwd -P)
          DD=$(cd "$DEVELOPER_DIR" && pwd -P)
          echo "wrapper compiler dir: $CL"
          case "$CL" in
            "$DD"/*) ;;
            *) echo "wrapper clang is outside pinned DEVELOPER_DIR ($DD)" >&2; exit 1 ;;
          esac
          "$CCACHE_WRAP/clang" --version | head -2

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-v2-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          mkdir -p sdk-kernel-platform
          for s in "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/KDKs/*/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX*.sdk; do
            P="$s/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform"
            if [ -d "$P" ]; then cp -R "$P" sdk-kernel-platform/; echo "platform headers from $s"; break; fi
          done
          # tar must not fail on a run that died before xnu compiled
          mkdir -p dxb/build/xnu.obj dxb/fakeroot/usr/local/include dxb/xnu
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          # the KDK layout differs per Xcode; find the archives instead of guessing
          # (an unmatched glob would leave a literal '*' in the file name, which
          # upload-artifact rejects)
          find /Library/Developer/KDKs -name 'lib*.a' 2>/dev/null > out/kdk-libs/libs.txt || true
          cat out/kdk-libs/libs.txt
          while read -r lib; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done < out/kdk-libs/libs.txt
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

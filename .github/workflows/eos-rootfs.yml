name: eos-rootfs

# Build an aarch64 root for land (Redmi 3S) out of Arch Linux ARM, in the shape
# EndeavourOS uses: an Arch base, the EndeavourOS layer on top when its repo
# answers for aarch64, packed as an ext4 image.  Nothing here needs a macOS
# runner, and no kernel is built: mkbootcmd.py writes the matching cmdline into
# the LineageOS 18 boot image, which already carries Linux 4.19.325-Mi8937v2 for
# this board, and the phone mounts this root with root=/dev/mmcblk0p49.
#
# The root is assembled inside an arm64 container.  A chroot with qemu-user was
# tried first and every pacman -Sy died with "Could not resolve host" even with
# nameserver 1.1.1.1 in the guest's resolv.conf and --disable-sandbox, while the
# same download from the runner host works: Docker gives the guest its own
# resolver instead of relying on the host's.

on:
  workflow_dispatch:
    inputs:
      size_gib:
        description: ext4 image size in GiB
        default: '6'
      desktop:
        description: also install the fbdev desktop (xfce4 + llvmpipe)
        type: boolean
        default: false
      endeavouros:
        description: add the EndeavourOS repository
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Enable arm64 emulation
        run: |
          set -euo pipefail
          # fix-binary binfmt is what lets the x86_64 kernel exec aarch64 ELF, so
          # the container runs the real pacman rather than a cross wrapper.
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker version --format '{{.Server.Version}}'

      - name: Build the root inside an Arch Linux ARM container
        env:
          DESKTOP: ${{ inputs.desktop && '1' || '0' }}
          EOS: ${{ inputs.endeavouros && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rootfs"
          docker pull --platform linux/arm64 archlinuxarm/archlinux-aarch64-image
          docker run --rm --platform linux/arm64 -e DESKTOP -e EOS \
            -v "$RUNNER_TEMP/rootfs":/work/rootfs \
            -v "$GITHUB_WORKSPACE/eos":/work/eos:ro \
            archlinuxarm/archlinux-aarch64-image bash -e /work/eos/pack.sh
          du -sh "$RUNNER_TEMP/rootfs"
          sudo ls "$RUNNER_TEMP/rootfs"

      - name: Pack the ext4 image
        run: |
          set -euo pipefail
          img=$RUNNER_TEMP/eos-rootfs.img
          # mkfs.ext4 -d copies a tree into an image with no loop device and no
          # mount, so nothing else in the runner has to cooperate.
          truncate -s "${{ inputs.size_gib }}G" "$img"
          sudo mkfs.ext4 -q -L eos -d "$RUNNER_TEMP/rootfs" "$img"
          ls -l "$img"
          sudo debugfs -R 'ls /' "$img" | head -3
          gzip -1 -c "$img" > "$img.gz"
          ls -l "$img.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: eos-rootfs
          path: ${{ runner.temp }}/eos-rootfs.img.gz

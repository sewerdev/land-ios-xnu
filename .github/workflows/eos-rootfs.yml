name: eos-rootfs

# Build an EndeavourOS root for land (Redmi 3S): an Arch Linux ARM base with the
# EndeavourOS repository, keyring, branding and tooling on top, packed as an ext4
# image that the phone mounts as /dev/mmcblk0p49 (userdata).
#
# No kernel is built or needed here: mkbootcmd.py writes the cmdline into the
# LineageOS 18 boot image, which already carries Linux 4.19.325-Mi8937v2 plus the
# phone's own DTB, and that kernel mounts this root.
#
# The root is assembled inside a container imported from the Arch Linux ARM
# tarball.  Two things were tried before this and both are recorded because they
# cost runs: gh's own artifact download stalls on multi-gigabyte zips, and a bare
# chroot of that tarball could not resolve any name (its nsswitch asks
# systemd-resolve, which does not exist in a chroot).  Docker gives the guest its
# own resolver, and the container has no architecture claim to fight with the
# host, so binfmt is what makes pacman inside it the real arm64 binary.

on:
  workflow_dispatch:
    inputs:
      size_gib:
        description: ext4 image size in GiB
        default: '6'
      desktop:
        description: also install the fbdev desktop (xfce4 + llvmpipe)
        type: boolean
        default: false
      endeavouros:
        description: add the EndeavourOS repository
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Enable arm64 emulation and import the ALARM base
        run: |
          set -euo pipefail
          # fix-binary binfmt lets the x86_64 kernel exec aarch64 ELF, so the
          # container runs the real pacman instead of a cross wrapper.
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          curl -sSL -o alarm.tar.gz http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          ls -l alarm.tar.gz
          docker import --change 'CMD ["/bin/bash"]' alarm.tar.gz alarm-aarch64:local
          docker images alarm-aarch64

      - name: Build the root inside the container
        env:
          DESKTOP: ${{ inputs.desktop && '1' || '0' }}
          EOS: ${{ inputs.endeavouros && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rootfs"
          # seccomp=unconfined because pacman 6 drops to the alpm user through
          # Landlock, and Docker's default profile does not let the landlock
          # syscalls through: the run before this one died with "restricting
          # filesystem access failed because Landlock is not supported by the
          # kernel" on the very first pacman -Sy.
          docker run --rm --security-opt seccomp=unconfined -e DESKTOP -e EOS \
            -v "$RUNNER_TEMP/rootfs":/work/rootfs \
            -v "$GITHUB_WORKSPACE/eos":/work/eos:ro \
            alarm-aarch64:local bash -e /work/eos/pack.sh
          du -sh "$RUNNER_TEMP/rootfs"
          sudo ls "$RUNNER_TEMP/rootfs"

      - name: Pack the ext4 image
        run: |
          set -euo pipefail
          img=$RUNNER_TEMP/eos-rootfs.img
          # mkfs.ext4 -d copies a tree into an image with no loop device and no
          # mount, so nothing else in the runner has to cooperate.
          truncate -s "${{ inputs.size_gib }}G" "$img"
          sudo mkfs.ext4 -q -L eos -d "$RUNNER_TEMP/rootfs" "$img"
          ls -l "$img"
          sudo debugfs -R 'ls /' "$img" | head -3
          gzip -1 -c "$img" > "$img.gz"
          ls -l "$img.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: eos-rootfs
          path: ${{ runner.temp }}/eos-rootfs.img.gz

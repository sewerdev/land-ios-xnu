name: root-image

# The open xnu-8796 tree has no APFS filesystem (only kern_apfs_reflock), while
# HFS+ is built in by the sweet patch set, so the root this kernel can mount is
# HFS+.  Nothing on the PC makes an HFS+ volume, so the conversion runs here:
# pull one DMG member out of an IPSW by range, let hdiutil decode the UDIF
# (including its LZFSE chunks) and mount the resulting APFS container with the
# system driver, re-export the files into a fresh HFS+ volume and hand it back in
# 400 MB parts, because one artifact file over ~500 MB is not reliable.
#
# Assemble on the PC:  cat root-hfs/root-hfs.part-* > root.hfs
on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: IPSW to take the DMG from
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
      dmg_member:
        description: DMG member inside the IPSW
        default: "087-86698-044.dmg"
      subset:
        description: "small = boot set (no assets/firmware/wallpapers); all = whole volume"
        type: choice
        options:
          - small
          - all
        default: small
      size_mb:
        description: "HFS+ volume size in MiB; land userdata is 25100 MiB"
        type: string
        default: "9000"

concurrency:
  group: root-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hfs:
    runs-on: macos-14
    timeout-minutes: 150
    env:
      WORK: ${{ github.workspace }}/work
      IPSW_URL: ${{ inputs.ipsw_url }}
      DMG_MEMBER: ${{ inputs.dmg_member }}
    steps:
      - uses: actions/checkout@v4

      - name: Free space first
        run: df -h /System/Volumes/Data | tail -1

      - name: Fetch the DMG member by HTTP range
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          python3 tools/fetch_zip_member.py "$IPSW_URL" "$DMG_MEMBER" "$WORK/volume.dmg"
          ls -l "$WORK/volume.dmg"
        # The script reads only the central directory first, then streams the
        # member, and refuses a compressed member (a range fetch needs stored).

      - name: Mount the DMG (hdiutil decodes UDIF, APFS mounts natively)
        run: |
          set -euo pipefail
          cd "$WORK"
          # There is no "hdiutil expand": attach the UDIF instead. hdiutildecodes
          # its chunks (LZFSE included) on the fly and the APFS volume inside is
          # mounted by the system driver, so no fuse helper and no 5.6 GB copy.
          hdiutil attach -readonly -nomount ./volume.dmg > devs.txt
          cat devs.txt
          PARENT=$(awk '/^[[:space:]]*\/dev\/disk/ {print $1; exit}' devs.txt)
          test -n "$PARENT" || { echo "no /dev/diskN from attach"; exit 1; }
          # the APFS container shows up as <parent>sN; ask diskutil which of them
          # holds the System volume, then let the system mount it read-only
          diskutil list "$PARENT"
          VOL=""
          for cand in $(diskutil list -plist "$PARENT" 2>/dev/null \
              | grep -o '/dev/disk[0-9]*s[0-9]*' | sort -u); do
            if mount -t apfs -o ro "$cand" /mnt 2>/dev/null; then VOL="$cand"; break; fi
          done
          if [ -z "$VOL" ]; then
            # fall back to auto-mounting the whole image and finding the volume
            hdiutil detach "$PARENT" -force >/dev/null 2>&1 || true
            hdiutil attach -readonly ./volume.dmg > mounted.txt
            cat mounted.txt
            VOL=$(awk '/\/dev\/disk/ {print $1}' mounted.txt | tail -1)
          fi
          echo "$VOL" > volume.dev
          SRC=""
          for v in /Volumes/*; do
            [ -d "$v/System/Library/CoreServices" ] && SRC="$v"
          done
          if [ -z "$SRC" ]; then
            mkdir -p mnt
            mount -t apfs -o ro "$VOL" mnt || { diskutil list; exit 1; }
            SRC="$PWD/mnt"
          fi
          test -d "$SRC/System/Library" || { echo "no System/Library under $SRC"; ls -l "$SRC"; exit 1; }
          echo "$SRC" > src.dir
          echo "source volume: $SRC"
          du -sh "$SRC" 2>/dev/null | tail -1
          ls "$SRC"

      - name: Format HFS+ and copy the payload
        run: |
          set -euo pipefail
          cd "$WORK"
          SRC=$(cat src.dir)
          df -h . | tail -1
          # land userdata is mmcblk0p49: LBA 9700368, which is what the kernel
          # calls the root window, and 26301931008 bytes - the 5635047424 figure
          # in the reader is the APFS container that used to sit there.  The
          # default volume stays small because every MiB of it is a MiB to
          # download and a MiB to write over USB, but it cannot be the size of
          # the files either: the source volume measures 4.8 GiB with du(1) and
          # HFS+ charges a 4 KiB block per file, which pushed the same content
          # past a 5.2 GiB volume and made rsync die with ENOSPC on a mkdir.
          SIZE_MB=${{ inputs.size_mb }}
          # macOS 14 runners ship no newfs_hfs and hdiutil has no raw -type, so
          # build a UDIF with a case-sensitive HFS+ volume (iOS paths are
          # case-sensitive and dyld expects it), fill it, then read the decoded
          # volume device back out: that dump is the dd-able image.
          rm -f root.dmg root.hfs
          hdiutil create -layout NONE -fs "Case-sensitive HFS+" -volname iOS \
            -size ${SIZE_MB}m -o root.dmg
          hdiutil attach root.dmg > attach.txt
          cat attach.txt
          DIR=/Volumes/iOS
          test -d "$DIR" || { echo "volume did not automount"; exit 1; }
          # Things the first boot does not need: downloaded asset catalogs,
          # fonts cache, wallpapers, per-device firmware bundles, and the machine
          # learning weights.  Skipping files by size has to stay coarse: the
          # first attempt capped at 32 MiB and the boot-set check below caught it
          # eating UIKit, whose binary alone is larger than that.
          #
          # macOS still ships rsync 2.6.9 (see its own error paths in the log),
          # which has no ** patterns and no --max-size, so the size cap has to
          # be a list built from the source with find(1).
          EXCLUDES=( --exclude '*.car' )
          if [ "${{ inputs.subset }}" != all ]; then
            EXCLUDES=(
              --exclude 'System/Library/AssetsV2/'
              --exclude 'System/Library/Assistants/'
              --exclude 'System/Library/Keyboard Layouts/'
              --exclude 'System/Library/Wallpaper/'
              --exclude 'System/Library/Fonts/'
              --exclude 'System/Library/Accessibility/'
              --exclude 'System/Library/Components/'
              --exclude 'System/Library/LocationBundles/'
              --exclude 'System/Library/PrivateFrameworks/AssistantServices/'
              --exclude '*.car'
              --exclude '*espresso*'
              --exclude '*.mlmodel*'
            )
          fi
          find "$SRC" -xdev -type f -size +128M 2>/dev/null | sed "s#^$SRC/##" > big.txt || true
          echo "files over 128 MiB skipped: $(wc -l < big.txt)"
          head -20 big.txt
          EXCLUDES+=( --exclude-from=big.txt )
          # shellcheck disable=SC2068
          rsync -a --ignore-errors ${EXCLUDES[@]+"${EXCLUDES[@]}"} "$SRC"/ "$DIR"/ && rc=0 || rc=$?
          echo "rsync returned $rc (0 = clean, 24 = files skipped)"
          df -h "$DIR" | tail -1
          if [ "$rc" -gt 24 ]; then
            echo "rsync died with $rc; that is the receiver losing the volume, not a skipped file"
            exit 1
          fi
          # The size cap is a blunt instrument, so name what it must not have
          # cost.  iOS 16 keeps its framework binaries in the dyld shared cache
          # instead of as files, so requiring UIKit.framework/UIKit would fail a
          # good image: only what the source actually has is required, and the
          # rest is reported.
          for need in sbin/launchd usr/lib/dyld usr/libexec/securityd \
                      System/Library/CoreServices/SpringBoard.app/SpringBoard \
                      System/Library/Frameworks/UIKit.framework/UIKit \
                      System/Library/Frameworks/Foundation.framework/Foundation; do
            if [ ! -e "$SRC/$need" ]; then
                echo "source has no $need (dyld cache only), not required"
            elif [ ! -f "$DIR/$need" ]; then
                echo "missing from the image although the source has it: $need"
                ls -l "$SRC/$need"
                exit 1
            else
                echo "carried: $need"
            fi
          done
          ls -l "$SRC/System/Library/Frameworks/UIKit.framework" 2>/dev/null | head -6
          mkdir -p "$DIR/dev" "$DIR/proc" "$DIR/tmp"
          sync
          hdiutil detach /Volumes/iOS
          # read the decoded volume back out: with -layout NONE the whole image
          # is the file system, so the device dump is exactly what the kernel
          # will find at the partition it is told to mount
          hdiutil attach -readonly -nomount root.dmg > devs.txt
          cat devs.txt
          VD=$(grep -oE '/dev/disk[0-9]+(s[0-9]+)?' devs.txt | tail -1)
          dd if="$VD" of=root.hfs bs=8m
          hdiutil detach "$VD" -force || true
          ls -lh root.hfs
          # an image larger than the partition would leave a half-written root
          SZ=$(wc -c < root.hfs | tr -d ' ')
          echo "root.hfs $SZ bytes"
          [ "$SZ" -le 26301931008 ] || { echo "image bigger than the userdata partition"; exit 1; }
          # verify the raw file by mounting it as a plain disk image
          hdiutil attach -readonly -imagekey diskimage-class=CRawDiskImage root.hfs > verify.txt
          cat verify.txt
          test -f /Volumes/iOS/sbin/launchd || { echo "launchd missing from the image"; exit 1; }
          test -f /Volumes/iOS/usr/lib/dyld || { echo "dyld missing from the image"; exit 1; }
          ls /Volumes/iOS
          du -sh /Volumes/iOS
          hdiutil detach /Volumes/iOS

      - name: Split for download
        run: |
          set -euo pipefail
          cd "$WORK"
          # Most of a fresh volume is unallocated space, and an HFS+ image of
          # zeros gzips down to about the size of its files: gigabytes of free
          # room costs nothing to carry, which is the difference between a flash
          # session and an afternoon of downloading.
          rm -f root.hfs.gz root.hfs.part-*
          gzip -1 -c root.hfs > root.hfs.gz
          ls -lh root.hfs root.hfs.gz
          shasum -a 256 root.hfs | tee root.hfs.sha256
          split -b 400m root.hfs.gz root.hfs.part-
          ls -l root.hfs.part-* | awk '{print $9, $5}'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: root-hfs
          path: |
            work/root.hfs.part-*
            work/root.hfs.sha256
          if-no-files-found: error
          retention-days: 5

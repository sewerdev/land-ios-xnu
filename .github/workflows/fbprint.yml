name: fbprint

# Build the panel painter for land as a Linux aarch64 binary.
#
# The first fbprint was built with the Android NDK, and it never ran once: bionic
# refuses to start a static executable whose TLS segment is aligned under 64 bytes on
# arm64, clang emits 8, so /bin/fbprint died of SIGABRT before main.  The boot probe
# calls it with its output swallowed, so the only symptom was the Xiaomi logo staying
# on the screen.
#
# Two Linux toolchains are built here because they are not equally safe on a 4.19
# kernel.  The initramfs already carries Alpine's musl busybox and it runs on the
# phone, so the musl static build is the one that gets packed; the glibc cross build
# is kept next to it as a second opinion, and both report the ELF fields that killed
# the NDK build so a future toolchain change cannot quietly bring them back.

on:
  workflow_dispatch:
  push:
    paths:
      - 'probe/fbprint.c'
      - 'probe/font8x16.h'
      - '.github/workflows/fbprint.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build musl static inside a real aarch64 container
        run: |
          set -euo pipefail
          # --platform is not decoration: without it docker pulls the amd64 alpine on
          # an x86_64 runner, gcc there is an x86_64 gcc, and the build "succeeds" as
          # an x86_64 binary that the phone can never exec.
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE":/work \
            alpine:3.20 sh -c '
            apk add --no-cache gcc musl-dev linux-headers >/dev/null &&
            gcc -O2 -static -Wall -Wextra \
              -I /work/probe -o /work/fbprint-musl /work/probe/fbprint.c &&
            ls -l /work/fbprint-musl'

      - name: Build glibc static with the Debian cross compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          # gcc-aarch64-linux-gnu pulls libc6-dev-arm64-cross, which is where this
          # build finds its own linux/fb.h.
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra \
            -I probe -o fbprint-glibc probe/fbprint.c
          file fbprint-glibc

      - name: Report what a loader will be asked to accept
        run: |
          set -euo pipefail
          for f in fbprint-musl fbprint-glibc; do
            echo "=== $f"
            readelf -h "$f" | grep -E 'Class:|Machine:|OS/ABI'
            readelf -lW "$f" | grep -E 'Type|TLS|INTERP' || echo 'no TLS segment, no interpreter'
            # grep counts zero matches as a failure, and a static libc leaves no
            # banner to find, so this line is information rather than a gate.
            strings -a "$f" | grep -icE 'musl|BIONIC' | sed 's/^/libc marker lines: /' ||
              echo 'libc marker lines: 0'
          done

      - name: Gate on the two things that broke before
        run: |
          set -euo pipefail
          for f in fbprint-musl fbprint-glibc; do
            # An x86_64 fbprint builds and runs happily on the runner, so the only way
            # to catch it is to ask the binary which machine it claims.
            if ! readelf -h "$f" | grep -q 'Machine:.*AArch64'; then
              echo "FAIL $f is not an AArch64 binary"
              readelf -h "$f" | grep 'Machine:'
              exit 1
            fi
            # Bionic's loader refuses a static executable whose TLS aligns under 64,
            # so a Linux ABI is the other thing that has to be true to run at all.
            if readelf -h "$f" | grep -q 'OS/ABI:.*ANDROID'; then
              echo "FAIL $f is an Android binary and will abort before main"
              exit 1
            fi
            echo "OK $f: AArch64, $(readelf -h "$f" | sed -n 's|^ *OS/ABI: *||p')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fbprint-aarch64
          path: |
            fbprint-musl
            fbprint-glibc
